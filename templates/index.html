<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>ТАИФ - Обработка входящих писем</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='styles/style.css') }}">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
  </head>
  <body>
    <header>
      <h1>AI-агент по обработке входящих писем АО "ТАИФ"</h1>

      <span><i>Адрес для получения входящей почты: </i></span>
      <a href="mailto:StryginaVM@taif.ru">StryginaVM@taif.ru</a>
      <div class="update-options">
        <ul class="update-options_list">
          <li class="update-options_list_item">
            <button id="startBtn">Запустить мониторинг</button>
            <button id="stopBtn" class="hidden">Остановить</button>
          </li>
       <ul>
      <div>
    </header>

      <main>
        <div>
          <ol class="steps-list">
              <li class="steps_list_element" id="textParseStatus">
              </li>
              <li class="steps_list_element" id="aiRecognitionStatus">
              </li>
              <li class="steps_list_element" id="directumRPAStatus">
              </li>
          </ol>
        </div>
        <div id="status"></div>
    <div id="chain">
        <h3>Цепочка выполнения:</h3>
        <div id="chainStages"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        const socket = io();
        
        document.getElementById('startBtn').onclick = () => {
            fetch('/start_monitor');
        };
        
        document.getElementById('stopBtn').onclick = () => {
            fetch('/stop_monitor');
        };
        
        socket.on('monitor_started', () => {
            document.getElementById('status').innerHTML = '✅ Мониторинг активен (каждые 5 мин)';
        });
        
        socket.on('new_email', data => {
            document.getElementById('status').innerHTML += `<br>📧 Получено новое письмо! ${data.subject}`;
        });

        socket.on('text_parse_started', data => {
            document.getElementById('textParseStatus').innerHTML += `<p class="list_element_text">Получение текста из письма...</p>`;
        });

        socket.on('text_parse_finished', data => {
            document.getElementById('textParseStatus').innerHTML += `<a href='../scripts/input_data/email.txt'>Полученный текст письма</a>`;
        });

        socket.on('ai_data_recognition_started', data => {
            document.getElementById('aiRecognitionStatus').innerHTML += `<p class="list_element_text">Извлечение ключевых данных из текста...</p>`;
        });

        socket.on('ai_data_recognition_finished', data => {
            document.getElementById('aiRecognitionStatus').innerHTML += `<a href='../scripts/processed_data.json'>JSON с данными</a>`;
        });

        socket.on('directum_rpa_started', data => {
            document.getElementById('directumRPAStatus').innerHTML += `<p class="list_element_text">Добавление входящего письма в Directum RX...</p>`;
        });

        socket.on('directum_rpa_finished', data => {
            document.getElementById('directumRPAStatus').innerHTML += `<p><i>Все готово!</i></p>`;
        });



        socket.on('chain_update', data => {
            document.getElementById('chainStages').innerHTML = `
                <p><strong>${data.stage}</strong>: ${data.status}</p>
                <pre>${data.log || ''}</pre>
            `;
        });
    </script>
      </main>

      <footer>

      </footer>

  </body>
</html>
