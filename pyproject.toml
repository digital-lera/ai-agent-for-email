[project]
name = "ai-agent"
version = "0.1.0"
description = "AI agent for TAIF corporate email"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "easyocr==1.7.2",
  "Flask==3.1.3",
  "flask-socketio==5.6.1",
  "gevent",
  "ollama==0.6.2",
  "openpyxl>=3.1.5",
  "pandas>=3.0.5",
  "pdf2image==1.17.0",
  "requests==2.34.2",
  "torch==2.12.0",
  "torchvision==0.27.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = "*_test.py"
python_functions = "test_*"
addopts = [
  "-vv",				        # подробный вывод хода теста
  "--import-mode=importlib"  	# меньше проблем с импортами
]
