services:
  app:
    build: .
    container_name: TAIF-mail
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    volumes:
      - .:/app

  ollama:
    image: ollama/ollama:latest
    container_name: taif-mail-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  ollama: