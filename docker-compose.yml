services:
  app:
    build: .
    container_name: TAIF-mail
    stdin_open: true
    tty: true
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    volumes:
      - .:/app
    command: "python app.py"

  ollama:
    image: ollama/ollama:latest
    container_name: taif-mail-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    # Добавьте этот блок для проброса GPU:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-pull-model:
    image: curlimages/curl:latest
    container_name: taif-mail-ollama-pull
    depends_on:
      - ollama
    restart: "no"
    entrypoint: [ "sh", "-c", "until curl -s http://ollama:11434/api/tags > /dev/null; do sleep 1; done; echo 'Starting model pull...'; curl -s -X POST http://ollama:11434/api/pull -d '{\"name\": \"bambucha/saiga-llama3:latest\"}' > /dev/null && echo 'Model pulled successfully!'" ]
    command: "ollama run bambucha/saiga-llama3"
    
volumes:
  ollama: