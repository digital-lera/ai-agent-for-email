name: CI for AI agent

on:
  push:
    branches: [ main ]

jobs:

  test:
    runs-on: self-hosted

    steps: 
    - name: Directum test
      run:
        cd ../../../
        pytest tests/directum_test.py

    - name: Email test
      run:
        cd ../../../
        pytest tests/email_test.py

  deploy:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup SSH key
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add server to known_hosts
      run: |
        ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

    - name: Copy files via SCP
      run: |
          ssh -o StrictHostKeyChecking=no ai@10.100.40.215 << 'EOF'
            cd /home/ai/taif-mail
            git pull origin main
          EOF
